name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buat proyek Flutter dan salin kode
        run: |
          flutter create --org id.contoh --project-name aplikasi_isp app
          cp pubspec.yaml app/pubspec.yaml
          cp lib/main.dart app/lib/main.dart

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-isp-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Rilis APK (agar bisa diunduh langsung)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Aplikasi ISP v1.0.${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
